<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="resetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <circle cx="60" cy="60" r="58" fill="url(#resetGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Pixel art style logo -->
  <g transform="translate(30, 30)">
    <!-- Letter M -->
    <rect x="0" y="10" width="8" height="40" fill="#ffffff"/>
    <rect x="8" y="15" width="8" height="8" fill="#ffffff"/>
    <rect x="16" y="20" width="8" height="8" fill="#ffffff"/>
    <rect x="24" y="15" width="8" height="8" fill="#ffffff"/>
    <rect x="32" y="10" width="8" height="40" fill="#ffffff"/>
    
    <!-- Key/lock design for password reset -->
    <rect x="45" y="15" width="20" height="25" fill="none" stroke="#ffffff" stroke-width="3" rx="10"/>
    <rect x="50" y="30" width="10" height="15" fill="#ffffff"/>
    <rect x="52" y="35" width="6" height="5" fill="#FF9800"/>
  </g>
  
  <!-- Lock icon overlay -->
  <g transform="translate(80, 80)">
    <rect x="5" y="15" width="20" height="15" fill="#FF5722" stroke="#ffffff" stroke-width="2" rx="2"/>
    <rect x="10" y="10" width="10" height="10" fill="none" stroke="#ffffff" stroke-width="2" rx="5"/>
    <circle cx="15" cy="22" r="2" fill="#ffffff"/>
  </g>
</svg>
