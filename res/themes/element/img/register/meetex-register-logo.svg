<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="registerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <circle cx="60" cy="60" r="58" fill="url(#registerGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Pixel art style logo -->
  <g transform="translate(30, 30)">
    <!-- Letter M -->
    <rect x="0" y="10" width="8" height="40" fill="#ffffff"/>
    <rect x="8" y="15" width="8" height="8" fill="#ffffff"/>
    <rect x="16" y="20" width="8" height="8" fill="#ffffff"/>
    <rect x="24" y="15" width="8" height="8" fill="#ffffff"/>
    <rect x="32" y="10" width="8" height="40" fill="#ffffff"/>
    
    <!-- Extended design for registration -->
    <rect x="45" y="10" width="8" height="40" fill="#ffffff"/>
    <rect x="53" y="10" width="16" height="8" fill="#ffffff"/>
    <rect x="53" y="25" width="16" height="8" fill="#ffffff"/>
    <rect x="53" y="42" width="16" height="8" fill="#ffffff"/>
  </g>
  
  <!-- Plus icon for "new account" -->
  <g transform="translate(85, 85)">
    <circle cx="15" cy="15" r="12" fill="#4CAF50" stroke="#ffffff" stroke-width="2"/>
    <rect x="12" y="9" width="6" height="12" fill="#ffffff"/>
    <rect x="9" y="12" width="12" height="6" fill="#ffffff"/>
  </g>
</svg>
